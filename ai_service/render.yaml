services:
  - type: web
    name: diu-ai-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: ai_service
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Set this in the Render dashboard (secret)
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_MAX_TOKENS
        value: "300"
      - key: GROQ_TEMPERATURE
        value: "0.1"
      - key: QDRANT_URL
        sync: false          # Set in Render dashboard
      - key: QDRANT_API_KEY
        sync: false          # Set in Render dashboard
      - key: QDRANT_COLLECTION
        value: diu_knowledge
      - key: REFRESH_INTERVAL_HOURS
        value: "24"
      - key: REFRESH_SECRET
        sync: false          # Generate and set in Render dashboard
      - key: UNIVERSITY_NAME
        value: Daffodil International University
      - key: UNIVERSITY_SHORT
        value: DIU
